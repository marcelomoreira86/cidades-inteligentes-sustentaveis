<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capim Grosso - Cidade Inteligente</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>body{margin:0;font-family:Arial;background:#f0f2f5}header{background:#0d5a36;color:#fff;padding:20px;text-align:center}#map{height:600px;width:90%;margin:20px auto;border-radius:10px}</style>
</head>
<body>
<header><h1>🌱 Cidades Inteligentes e Sustentáveis</h1><p>Dashboard de mobilidade urbana - Capim Grosso-BA | Por Marcelo Moreira</p></header>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var map = L.map('map').setView([-11.38, -40.012], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
L.marker([-11.38, -40.012]).addTo(map).bindPopup("<b>Centro</b><br>Tráfego Livre - Baixo CO2").openPopup();
L.marker([-11.385, -40.015]).addTo(map).bindPopup("Rodoviária - Fluxo Lento");
L.marker([-11.375, -40.008]).addTo(map).bindPopup("Prefeitura - Sensor Ar: Bom");
</script>
</body>
</html>
