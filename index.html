<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capim Grosso - Cidade Inteligente</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f0f2f5; }
        header { background: #0d5a36; color: white; padding: 20px; text-align: center; }
        .container { display: flex; flex-wrap: wrap; padding: 20px; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; flex: 1; min-width: 250px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #map { height: 500px; width: 100%; border-radius: 10px; flex: 2; min-width: 300px; }
        .status-verde { color: green; font-weight: bold; }
        .status-amarelo { color: orange; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>Dashboard - Mobilidade Urbana | Capim Grosso-BA</h1>
        <p>Monitoramento em tempo real - Projeto Cidades Inteligentes e Sustentáveis</p>
    </header>

    <div class="container">
        <div style="display:flex; flex-direction:column; gap:20px; flex:1;">
            <div class="card">
                <h3>🚦 Trânsito Centro</h3>
                <p class="status-verde">● Fluindo</p>
                <p>Av. ACM - Fluxo normal</p>
            </div>
            <div class="card">
                <h3>🚌 Transporte Público</h3>
                <p class="status-verde">● Operando</p>
                <p>3 linhas ativas hoje</p>
            </div>
            <div class="card">
                <h3>🌱 Qualidade do Ar</h3>
                <p class="status-verde">● Boa - 32 AQI</p>
                <p>Dados de sensores IoT</p>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Coordenadas de Capim Grosso-BA
        var map = L.map('map').setView([-11.3800, -40.0120], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        // Marcadores
        L.marker([-11.3800, -40.0120]).addTo(map).bindPopup("<b>Centro - Capim Grosso</b><br>Fluxo normal").openPopup();
        L.marker([-11.3850, -40.0150]).addTo(map).bindPopup("Rodoviária<br>Ônibus em operação");
        L.marker([-11.3750, -40.0080]).addTo(map).bindPopup("Prefeitura<br>Sensor de qualidade do ar: Bom");
    </script>
</body>
</html>
